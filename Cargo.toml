[package]
name = "cq"
version = "0.1.0"
edition = "2021"
description = "Local code search for coding agents: BM25 passages + go-to-definition, CLI and MCP. No network."

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"

[profile.release]
strip = true
lto = true
